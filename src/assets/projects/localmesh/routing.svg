<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <title>Hardware-aware request routing — LocalMesh architecture illustration</title>
  <defs><radialGradient id="halo"><stop stop-color="#19305a"/><stop offset="1" stop-color="#0b1019"/></radialGradient>
  <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#98b9f52a"/></pattern></defs>
  <style>text{font-family:'Space Grotesk',Arial,sans-serif}.mono{font-family:'IBM Plex Mono',Menlo,monospace}</style><rect x="1" y="1" width="998" height="498" rx="16" fill="#0b1019" stroke="#33445e"/>
  <rect x="2" y="50" width="996" height="448" fill="url(#halo)"/><rect x="2" y="50" width="996" height="448" fill="url(#grid)"/>
  <path d="M2 50H998" stroke="#26364e"/>
  <circle cx="23" cy="25" r="4" fill="#739bff"/><circle cx="37" cy="25" r="4" fill="#43536e"/><circle cx="51" cy="25" r="4" fill="#43536e"/>
  <text x="76" y="30" font-size="14" fill="#e8ecf4" >Hardware-aware request routing</text><text x="734" y="30" font-size="10" fill="#8d9eba" class="mono">ARCHITECTURE ILLUSTRATION</text>
  <text x="50" y="105" font-size="31" fill="#eff4ff" font-weight="600">One request. One eligible device.</text><text x="50" y="139" font-size="16" fill="#9eafcb" >Independent inference workloads; models fit on a single node.</text><path d="M277 238H365" fill="none" stroke="#537bce" stroke-width="2"/><path d="M277 238H365" fill="none" stroke="#6998ff22" stroke-width="8"/><path d="M635 238H724" fill="none" stroke="#537bce" stroke-width="2"/><path d="M635 238H724" fill="none" stroke="#6998ff22" stroke-width="8"/><rect x="50" y="187" width="227" height="102" rx="12" fill="#101722" stroke="#2b3c58"/><rect x="70" y="207" width="22" height="22" rx="6" fill="#4f7cff20" stroke="#739aff80"/><text x="106" y="224" font-size="19" fill="#edf2fc" font-weight="600">OpenAI SDK</text><text x="70" y="252" font-size="13" fill="#aab8cf" >Inference request</text><text x="70" y="272" font-size="11" fill="#7386a7" class="mono">POST /v1/chat/completions</text><rect x="365" y="187" width="270" height="102" rx="12" fill="#101722" stroke="#2b3c58"/><rect x="385" y="207" width="22" height="22" rx="6" fill="#4f7cff20" stroke="#739aff80"/><text x="421" y="224" font-size="19" fill="#edf2fc" font-weight="600">Scheduler</text><text x="385" y="252" font-size="13" fill="#aab8cf" >Explainable node selection</text><text x="385" y="272" font-size="11" fill="#7386a7" class="mono">ELIGIBILITY → WEIGHTED SCORING</text><rect x="724" y="187" width="226" height="102" rx="12" fill="#101722" stroke="#2b3c58"/><rect x="744" y="207" width="22" height="22" rx="6" fill="#4f7cff20" stroke="#739aff80"/><text x="780" y="224" font-size="19" fill="#edf2fc" font-weight="600">Local node</text><text x="744" y="252" font-size="13" fill="#aab8cf" >Whole-request execution</text><text x="744" y="272" font-size="11" fill="#7386a7" class="mono">OLLAMA ENGINE</text><rect x="50" y="328" width="900" height="105" rx="14" fill="#101824" stroke="#2a3a56"/><text x="76" y="355" font-size="10" fill="#83a5df" class="mono">WHAT THE SCHEDULER CONSIDERS</text><text x="76" y="385" font-size="18" fill="#e8ecf4" >Model availability · loaded state · free RAM / VRAM</text><text x="76" y="414" font-size="16" fill="#aebed8" >CPU / GPU utilization · queue depth · latency · node health</text>
  <text x="32" y="480" font-size="9" fill="#6c7f9c" class="mono">LOCALMESH / SOURCE-DERIVED DIAGRAM / NOT LIVE TELEMETRY</text>
</svg>